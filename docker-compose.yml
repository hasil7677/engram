version: "3.9"

# .env has QDRANT_HOST/REDIS_HOST/NEO4J_URI/CELERY_* set to localhost, which is
# correct for running the app directly on the host against forwarded ports but
# wrong inside these containers (localhost there means the container itself,
# not its sibling containers). environment: overrides env_file: for the same
# key, so this repoints them at the compose service DNS names without having
# to touch .env.
x-container-env: &container-env
  QDRANT_HOST: qdrant
  REDIS_HOST: redis
  NEO4J_URI: bolt://neo4j:7687
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/engram_dev_password
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      <<: *container-env
    depends_on:
      - qdrant
      - redis
      - neo4j
    volumes:
      - ./app:/app/app

  celery_worker:
    build: .
    command: celery -A app.workers.celery_app worker --loglevel=info --pool=solo
    env_file:
      - .env
    environment:
      <<: *container-env
    depends_on:
      - qdrant
      - redis
      - neo4j
    volumes:
      - ./app:/app/app

  celery_beat:
    build: .
    command: celery -A app.workers.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      <<: *container-env
    depends_on:
      - qdrant
      - redis
      - neo4j
    volumes:
      - ./app:/app/app

volumes:
  qdrant_data:
  redis_data:
  neo4j_data:
